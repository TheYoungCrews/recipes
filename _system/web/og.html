<!doctype html><html><head><meta charset=utf-8><style>
@font-face{font-family:Hand;src:url(caveat.woff2)}
body{margin:0;width:1200px;height:630px;display:flex;align-items:center;justify-content:center;background:url(tablecloth.jpg) center/cover}
.box{width:980px;filter:drop-shadow(0 18px 28px rgba(40,35,25,.35))}
.tab{width:90%;margin:0 auto;background:#efe4c8;border:2px solid #d8c9a3;border-bottom:none;border-radius:36px 36px 0 0;padding:30px 34px 26px}
.lbl{background:#fffdf6;border:2px solid #cdbf9c;border-radius:8px;padding:10px 50px 4px;text-align:center;transform:rotate(-1.2deg);background-image:linear-gradient(transparent 74%,rgba(184,66,58,.3) 74%,rgba(184,66,58,.3) 77%,transparent 77%);position:relative}
.lbl:before,.lbl:after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#b9a77c}
.lbl:before{left:14px}.lbl:after{right:14px}
h1{margin:0;font:700 84px/1.15 Hand,cursive;color:#1d1b18;white-space:nowrap}
.lip{height:32px;background:#e6d8b6;border:2px solid #d8c9a3;border-radius:0 0 12px 12px}
</style></head><body><div class=box><div class=tab><div class=lbl><h1>Crews &amp; Anna's Kitchen</h1></div></div><div class=lip></div></div></body></html>
